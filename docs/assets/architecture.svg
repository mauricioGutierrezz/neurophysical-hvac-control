<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Neurophysical HVAC Control — five-layer research design</title>
<desc id="desc">A conceptual pipeline from physical observations through causal state, shared representations and coordinated decisions to constrained actions. The full architecture is proposed. No performance data are shown.</desc>
